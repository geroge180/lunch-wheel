<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 中午吃什么</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 40px 48px;
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.25),
      inset 0 1px 2px rgba(255, 255, 255, 0.6);
    max-width: 780px;
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.4);
    transition: all 0.3s ease;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  .header p {
    color: #888;
    font-size: 14px;
    margin-top: 6px;
    font-weight: 500;
  }

  .wheel-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 30px solid #f5576c;
    filter: drop-shadow(0 4px 8px rgba(245, 87, 108, 0.5));
  }

  .pointer::after {
    content: '';
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    background: #f5576c;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.8);
  }

  #wheel {
    width: 340px;
    height: 340px;
    border-radius: 50%;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.12),
      0 2px 8px rgba(0, 0, 0, 0.06);
    transition: box-shadow 0.3s ease;
    display: block;
  }

  #wheel:hover {
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.18),
      0 2px 8px rgba(0, 0, 0, 0.08);
  }

  #celebrationCanvas {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: none;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 24px 0 16px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Noto Sans SC', sans-serif;
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 1px;
  }

  .btn-spin {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
    box-shadow: 0 8px 20px rgba(245, 87, 108, 0.35);
  }

  .btn-spin:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 28px rgba(245, 87, 108, 0.45);
  }

  .btn-spin:active:not(:disabled) {
    transform: translateY(0) scale(0.98);
  }

  .btn-spin:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn-edit {
    background: rgba(0, 0, 0, 0.08);
    color: #555;
    box-shadow: none;
    padding: 14px 24px;
    font-size: 15px;
  }

  .btn-edit:hover {
    background: rgba(0, 0, 0, 0.14);
    color: #333;
  }

  .result {
    text-align: center;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .result-text {
    font-size: 26px;
    font-weight: 900;
    color: #333;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .result-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 4px;
  }

  .history-section {
    margin-top: 24px;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding-top: 20px;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .history-header h3 {
    font-size: 14px;
    color: #999;
    font-weight: 500;
  }

  .btn-clear {
    background: none;
    border: none;
    color: #ccc;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .btn-clear:hover {
    color: #f5576c;
    background: rgba(245, 87, 108, 0.08);
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-item {
    background: rgba(0,0,0,0.05);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }

  .edit-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }

  .edit-modal-overlay.active {
    display: flex;
  }

  .edit-modal {
    background: white;
    border-radius: 24px;
    padding: 32px 36px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .edit-modal h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
    text-align: center;
  }

  .edit-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .edit-color {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .edit-item input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #eee;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .edit-item input[type="text"]:focus {
    border-color: #f5576c;
  }

  .edit-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .edit-actions .btn {
    flex: 1;
    padding: 12px;
    font-size: 15px;
  }

  .btn-save {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
  }

  .btn-cancel {
    background: rgba(0,0,0,0.06);
    color: #666;
  }

  @media (max-width: 520px) {
    .container { padding: 24px 20px; }
    #wheel { width: 280px; height: 280px; }
    .header h1 { font-size: 26px; }
    .btn { padding: 12px 28px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🍽️ 中午吃什么</h1>
    <p>命运的转盘会给你答案</p>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel" width="680" height="680"></canvas>
  </div>

  <div class="controls">
    <button class="btn btn-spin" id="spinBtn" onclick="spin()">🎯 转一转</button>
    <button class="btn btn-edit" onclick="openEdit()">✏️ 编辑菜单</button>
  </div>

  <div class="result">
    <div class="result-text" id="resultText">
      <span class="result-emoji" id="resultEmoji">🤔</span>
      <span id="resultLabel">点击转盘试试手气</span>
    </div>
  </div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="history-header">
      <h3>📋 抽签历史</h3>
      <button class="btn-clear" onclick="clearHistory()">清空</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<canvas id="celebrationCanvas"></canvas>

<div class="edit-modal-overlay" id="editOverlay">
  <div class="edit-modal">
    <h2>✏️ 编辑今日菜单</h2>
    <div id="editList"></div>
    <div class="edit-actions">
      <button class="btn btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn btn-save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
  const COLORS = [
    '#FF6B6B', '#4ECDC4', '#FFB347', '#5B86E5',
    '#A68CDE', '#F7DC6F', '#82CCDD', '#E56B9D'
  ];

  const DARK_TEXT_COLORS = ['#F7DC6F', '#FFB347', '#82CCDD', '#A68CDE'];
  const EMOJIS = ['🥟', '🍜', '🥗', '🍱', '🐟', '🍗', '🍜', '🥟'];

  let items = ['麻辣烫', '牛肉面', '轻食沙拉', '日料定食', '酸菜鱼', '黄焖鸡', '螺蛳粉', '广式茶点'];
  let colors = [...COLORS];
  let currentAngle = 0;
  let spinning = false;
  let history = JSON.parse(localStorage.getItem('lunchHistory') || '[]');

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const DPR = window.devicePixelRatio || 1;

  // Set canvas size - use CSS size * DPR for crispness
  const size = 340;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = size * DPR;
  canvas.height = size * DPR;
  ctx.scale(DPR, DPR);

  function drawWheel(rotation) {
    const cx = size / 2, cy = size / 2, r = size / 2 - 8;
    const count = items.length;
    const slice = (2 * Math.PI) / count;

    ctx.clearRect(0, 0, size, size);

    // Draw outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();

    // Draw slices
    for (let i = 0; i < count; i++) {
      const start = rotation + i * slice - Math.PI / 2;
      const end = start + slice;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();

      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();

      // Slice border
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Label
      const angle = start + slice / 2;
      const labelR = r * 0.62;
      const x = cx + Math.cos(angle) * labelR;
      const y = cy + Math.sin(angle) * labelR;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + (angle > Math.PI / 2 && angle < 3 * Math.PI / 2 ? Math.PI : 0));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Emoji
      ctx.font = 'bold 22px "Noto Sans SC", sans-serif';
      ctx.fillText(EMOJIS[i % EMOJIS.length], 0, -16);

      // Text
      ctx.font = 'bold 14px "Noto Sans SC", sans-serif';
      const isDark = !DARK_TEXT_COLORS.includes(colors[i % colors.length]) && i % colors.length !== 2;
      ctx.fillStyle = isDark ? '#fff' : '#333';
      ctx.fillText(items[i], 0, 12);

      ctx.restore();
    }

    // Center circle
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#f0f0f0');
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Center text
    ctx.fillStyle = '#666';
    ctx.font = 'bold 16px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍽️', cx, cy);
  }

  function getResult(rotation) {
    const count = items.length;
    const slice = (2 * Math.PI) / count;
    // Pointer is at top (-PI/2). DrawWheel draws slice i from (rotation + i*slice - PI/2) to (rotation + i*slice - PI/2 + slice).
    // The pointer at -PI/2 means we need: pointerAngle = -PI/2
    // Convert rotation to find which slice covers -PI/2:
    // slice i covers [rotation + i*slice - PI/2, rotation + i*slice - PI/2 + slice)
    // So: rotation + i*slice - PI/2 <= -PI/2 < rotation + i*slice - PI/2 + slice
    // => i*slice <= -rotation < i*slice + slice
    // => i <= -rotation/slice < i + 1
    // => i = floor(-rotation / slice)
    // Handle negative: we want positive modulo
    let rawIdx = -rotation / slice;
    let idx = Math.floor(rawIdx) % count;
    if (idx < 0) idx += count;
    return idx;
  }

  function showResult(idx) {
    const el = document.getElementById('resultText');
    const emoji = document.getElementById('resultEmoji');
    const label = document.getElementById('resultLabel');

    emoji.textContent = EMOJIS[idx % EMOJIS.length];
    label.textContent = '今天吃：' + items[idx] + ' 🎉';

    el.classList.add('show');
    startCelebration();

    // Add to history
    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    history.unshift({ item: items[idx], time: timeStr });
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem('lunchHistory', JSON.stringify(history));
    renderHistory();
  }

  function spin() {
    if (spinning || items.length === 0) return;

    spinning = true;
    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = '🌀 转动中...';

    document.getElementById('resultText').classList.remove('show');

    // Random spin: 5-9 full rotations + random offset
    const extraSpins = 5 + Math.random() * 4;
    const destAngle = Math.random() * 2 * Math.PI;
    const totalRotation = currentAngle + extraSpins * 2 * Math.PI + destAngle;

    const startAngle = currentAngle;
    const duration = 4000 + Math.random() * 1000;
    const startTime = performance.now();

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutBack(t) {
      const c = 1.7;
      return 1 + c * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    }

    function animate(time) {
      const elapsed = time - startTime;
      const progress = Math.min(elapsed / duration, 1);

      // Use cubic ease-out with a small back bounce at the end
      const eased = progress < 0.97
        ? easeOutCubic(progress / 0.97)
        : 0.97 + 0.03 * easeOutBack((progress - 0.97) / 0.03);

      const angle = startAngle + (totalRotation - startAngle) * eased;
      currentAngle = angle;
      drawWheel(angle);

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        currentAngle = totalRotation;
        drawWheel(totalRotation);
        spinning = false;
        btn.disabled = false;
        btn.textContent = '🎯 转一转';

        const idx = getResult(totalRotation);
        // Slight delay for drama
        setTimeout(() => showResult(idx), 300);
      }
    }

    requestAnimationFrame(animate);
  }

  function openEdit() {
    const overlay = document.getElementById('editOverlay');
    const list = document.getElementById('editList');
    list.innerHTML = '';

    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'edit-item';

      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.className = 'edit-color';
      colorInput.value = colors[i];
      colorInput.dataset.idx = i;

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.value = item;
      textInput.dataset.idx = i;
      textInput.placeholder = '输入菜名...';

      div.appendChild(colorInput);
      div.appendChild(textInput);
      list.appendChild(div);
    });

    overlay.classList.add('active');
  }

  function closeEdit() {
    document.getElementById('editOverlay').classList.remove('active');
  }

  function saveEdit() {
    const textInputs = document.querySelectorAll('#editList input[type="text"]');
    const colorInputs = document.querySelectorAll('#editList input[type="color"]');

    const newItems = [];
    const newColors = [];

    textInputs.forEach((input, i) => {
      const val = input.value.trim();
      if (val) {
        newItems.push(val);
        newColors.push(colorInputs[i].value);
      }
    });

    if (newItems.length < 2) {
      alert('至少需要 2 个菜品！');
      return;
    }

    items = newItems;
    colors = newColors;
    currentAngle = 0;
    drawWheel(0);
    document.getElementById('resultText').classList.remove('show');
    closeEdit();
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');

    if (history.length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    list.innerHTML = '';
    history.forEach(h => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.textContent = h.time + ' ' + h.item;
      list.appendChild(div);
    });
  }

  function clearHistory() {
    if (!confirm('确定清空所有抽签记录？')) return;
    history = [];
    localStorage.removeItem('lunchHistory');
    renderHistory();
  }

  // --- Celebration Canvas ---
  const cCanvas = document.getElementById('celebrationCanvas');
  const cCtx = cCanvas.getContext('2d');
  let cAnimId = null;
  let cParticles = [];

  function resizeCelebration() {
    cCanvas.width = window.innerWidth * DPR;
    cCanvas.height = window.innerHeight * DPR;
    cCtx.scale(DPR, DPR);
  }
  window.addEventListener('resize', resizeCelebration);

  function createFirework(x, y) {
    const colors = ['#FF6B6B','#FFB347','#4ECDC4','#5B86E5','#A68CDE','#F7DC6F','#E56B9D','#FF9A9E'];
    const count = 30 + Math.floor(Math.random() * 20);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const speed = 2 + Math.random() * 4;
      cParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.015,
        size: 3 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        type: 'firework'
      });
    }
  }

  function createConfetti() {
    const colors = ['#FF6B6B','#4ECDC4','#FFB347','#5B86E5','#A68CDE','#F7DC6F','#E56B9D','#FF9A9E'];
    for (let i = 0; i < 40; i++) {
      cParticles.push({
        x: Math.random() * (cCanvas.width / DPR),
        y: -Math.random() * 100,
        vx: (Math.random() - 0.5) * 2,
        vy: 1 + Math.random() * 3,
        life: 1,
        decay: 0.005 + Math.random() * 0.008,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        type: 'confetti'
      });
    }
  }

  function animateCelebration() {
    const w = cCanvas.width / DPR;
    const h = cCanvas.height / DPR;
    cCtx.clearRect(0, 0, w, h);

    for (let i = cParticles.length - 1; i >= 0; i--) {
      const p = cParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.life -= p.decay;

      if (p.type === 'confetti') {
        p.rotation += p.rotSpeed;
      }

      if (p.life <= 0) {
        cParticles.splice(i, 1);
        continue;
      }

      cCtx.globalAlpha = Math.max(0, p.life);

      if (p.type === 'firework') {
        cCtx.beginPath();
        cCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        cCtx.fillStyle = p.color;
        cCtx.fill();
      } else if (p.type === 'confetti') {
        cCtx.save();
        cCtx.translate(p.x, p.y);
        cCtx.rotate(p.rotation);
        cCtx.fillStyle = p.color;
        cCtx.fillRect(-p.size / 2, -3, p.size, 6);
        cCtx.restore();
      }
    }

    cCtx.globalAlpha = 1;

    if (cParticles.length > 0) {
      cAnimId = requestAnimationFrame(animateCelebration);
    } else {
      cCanvas.style.display = 'none';
    }
  }

  function startCelebration() {
    if (cAnimId) {
      cancelAnimationFrame(cAnimId);
      cAnimId = null;
    }
    cParticles = [];
    resizeCelebration();

    const w = cCanvas.width / DPR;
    const h = cCanvas.height / DPR;

    createFirework(w * 0.3 + Math.random() * 0.1 * w, h * 0.3 + Math.random() * 0.1 * h);
    createFirework(w * 0.6 + Math.random() * 0.1 * w, h * 0.25 + Math.random() * 0.1 * h);
    createConfetti();

    cCanvas.style.display = 'block';
    animateCelebration();
  }

  // Initialize
  drawWheel(0);
  renderHistory();

  // Close edit modal on overlay click
  document.getElementById('editOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeEdit();
  });

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('editOverlay').classList.contains('active')) {
      spin();
    }
  });
</script>
</body>
</html>
